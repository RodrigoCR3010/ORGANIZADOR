<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Personal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a3a52;
            --primary-light: #2d5a7b;
            --accent-high: #ff6b4a;
            --accent-medium: #ffa500;
            --accent-low: #4ecdc4;
            --success: #2ecc71;
            --bg-main: #f8f9fa;
            --bg-secondary: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-main) 0%, #f0f4f8 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 30px;
        }

        /* HEADER */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-high) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-date {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* CALENDARIO */
        .calendar-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            border: 1px solid var(--border);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }

        .month-year {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary);
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        button:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 58, 82, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .weekday {
            text-align: center;
            font-weight: 700;
            color: var(--primary);
            font-size: 0.9rem;
            padding: 10px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 12px 8px;
            border-radius: 12px;
            background: var(--bg-main);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 100px;
            position: relative;
            font-weight: 600;
        }

        .day.other-month {
            color: var(--text-secondary);
            opacity: 0.4;
            pointer-events: none;
        }

        .day.today {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border-color: var(--primary);
        }

        .day.selected {
            border-color: var(--accent-high);
            background: rgba(255, 107, 74, 0.1);
        }

        .day:hover:not(.other-month) {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(26, 58, 82, 0.15);
            border-color: var(--accent-high);
        }

        .day-number {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .day-events {
            font-size: 0.7rem;
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .event-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-high);
        }

        .event-dot.high {
            background: var(--accent-high);
        }

        .event-dot.medium {
            background: var(--accent-medium);
        }

        .event-dot.low {
            background: var(--accent-low);
        }

        /* SIDEBAR */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* TAREAS */
        .tasks-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .tasks-list::-webkit-scrollbar {
            width: 6px;
        }

        .tasks-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .tasks-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .tasks-list::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            background: var(--bg-main);
            border-radius: 10px;
            border-left: 4px solid var(--accent-low);
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .task-item.high {
            border-left-color: var(--accent-high);
            background: rgba(255, 107, 74, 0.08);
        }

        .task-item.medium {
            border-left-color: var(--accent-medium);
            background: rgba(255, 165, 0, 0.08);
        }

        .task-item.low {
            border-left-color: var(--accent-low);
            background: rgba(46, 204, 113, 0.08);
        }

        .task-item.completed {
            opacity: 0.6;
            background: rgba(46, 204, 113, 0.15);
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .checkbox {
            width: 20px;
            height: 20px;
            min-width: 20px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .checkbox:hover {
            border-color: var(--primary);
        }

        .task-item.completed .checkbox {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-text {
            font-size: 0.9rem;
            font-weight: 500;
            word-break: break-word;
            color: var(--text-primary);
        }

        .task-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .delete-btn {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 1.2rem;
            opacity: 0;
            transition: all 0.2s ease;
            min-width: auto;
        }

        .task-item:hover .delete-btn {
            opacity: 1;
            color: var(--accent-high);
        }

        /* FORM NUEVA TAREA */
        .add-task-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 16px;
            border-top: 2px solid var(--border);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            background: white;
            color: var(--text-primary);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 58, 82, 0.1);
        }

        .priority-selector {
            display: flex;
            gap: 8px;
        }

        .priority-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.85rem;
            background: var(--bg-main);
            color: var(--text-secondary);
            border: 2px solid var(--border);
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .priority-btn.high {
            background: var(--accent-high);
            color: white;
            border-color: var(--accent-high);
        }

        .priority-btn.medium {
            background: var(--accent-medium);
            color: white;
            border-color: var(--accent-medium);
        }

        .priority-btn.low {
            background: var(--accent-low);
            color: white;
            border-color: var(--accent-low);
        }

        .add-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            font-weight: 700;
            padding: 12px 16px;
            font-size: 1rem;
        }

        /* REMINDERS */
        .reminders-section {
            background: linear-gradient(135deg, var(--accent-high) 0%, var(--accent-medium) 100%);
            border-radius: 16px;
            padding: 24px;
            color: white;
            box-shadow: 0 8px 16px rgba(255, 107, 74, 0.3);
        }

        .reminders-section .section-title {
            color: white;
            margin-bottom: 16px;
        }

        .reminder-item {
            padding: 12px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .reminder-item:last-child {
            margin-bottom: 0;
        }

        .reminder-time {
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
            font-size: 0.85rem;
        }

        .no-reminders {
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.8;
            padding: 20px;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                grid-column: 1 / -1;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }

            .reminders-section {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 768px) {
            .container {
                gap: 20px;
            }

            .sidebar {
                grid-template-columns: 1fr;
            }

            .header-title {
                font-size: 1.8rem;
            }

            .calendar-section {
                padding: 20px;
            }

            .day {
                min-height: 80px;
                font-size: 0.85rem;
            }

            .day-number {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="header-title">📅 Organizador</h1>
            <div class="header-date" id="todayDate"></div>
        </header>

        <section class="calendar-section">
            <div class="calendar-header">
                <h2 class="month-year" id="monthYear"></h2>
                <div class="nav-buttons">
                    <button onclick="previousMonth()">← Anterior</button>
                    <button onclick="today()">Hoy</button>
                    <button onclick="nextMonth()">Siguiente →</button>
                </div>
            </div>

            <div class="weekdays">
                <div class="weekday">Dom</div>
                <div class="weekday">Lun</div>
                <div class="weekday">Mar</div>
                <div class="weekday">Mié</div>
                <div class="weekday">Jue</div>
                <div class="weekday">Vie</div>
                <div class="weekday">Sáb</div>
            </div>

            <div class="calendar-grid" id="calendarGrid"></div>
        </section>

        <section class="tasks-section">
            <h2 class="section-title">✓ Tareas</h2>
            <div class="tasks-list" id="tasksList"></div>

            <div class="add-task-form">
                <div class="form-group">
                    <label>Nueva tarea</label>
                    <input type="text" id="taskInput" placeholder="¿Qué necesitas hacer?" />
                </div>

                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" id="taskDate" />
                </div>

                <div class="form-group">
                    <label>Prioridad</label>
                    <div class="priority-selector">
                        <button class="priority-btn high" onclick="selectPriority('high')">Alta</button>
                        <button class="priority-btn medium" onclick="selectPriority('medium')">Media</button>
                        <button class="priority-btn low" onclick="selectPriority('low')">Baja</button>
                    </div>
                </div>

                <button class="add-btn" onclick="addTask()">Agregar Tarea</button>
            </div>
        </section>

        <section class="reminders-section">
            <h2 class="section-title">⏰ Próximos Recordatorios</h2>
            <div id="remindersList"></div>
        </section>
    </div>

    <script>
        let currentDate = new Date();
        let selectedPriority = 'high';
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        // Inicializar
        function init() {
            renderCalendar();
            renderTasks();
            updateReminders();
            updateHeaderDate();
            document.getElementById('taskDate').valueAsDate = new Date();
        }

        // Render Calendario
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const today = new Date();

            document.getElementById('monthYear').textContent =
                currentDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }).charAt(0).toUpperCase() +
                currentDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }).slice(1);

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const prevLastDay = new Date(year, month, 0);

            let html = '';

            // Días del mes anterior
            for (let i = firstDay.getDay() - 1; i >= 0; i--) {
                const date = new Date(prevLastDay.getFullYear(), prevLastDay.getMonth(), prevLastDay.getDate() - i);
                html += createDayElement(date, true);
            }

            // Días del mes actual
            for (let i = 1; i <= lastDay.getDate(); i++) {
                const date = new Date(year, month, i);
                html += createDayElement(date, false);
            }

            // Días del siguiente mes
            for (let i = 1; i <= (42 - firstDay.getDay() - lastDay.getDate()); i++) {
                const date = new Date(year, month + 1, i);
                html += createDayElement(date, true);
            }

            document.getElementById('calendarGrid').innerHTML = html;
        }

        function createDayElement(date, isOtherMonth) {
            const today = new Date();
            const isToday = date.toDateString() === today.toDateString();
            const dateStr = date.toISOString().split('T')[0];

            const dayTasks = tasks.filter(t => t.date === dateStr);
            const eventDots = dayTasks.map(t => `<span class="event-dot ${t.priority}"></span>`).join('');

            let className = 'day';
            if (isOtherMonth) className += ' other-month';
            if (isToday) className += ' today';

            return `
                <div class="${className}" onclick="selectDay('${dateStr}')">
                    <div class="day-number">${date.getDate()}</div>
                    <div class="day-events">${eventDots}</div>
                </div>
            `;
        }

        function selectDay(dateStr) {
            document.querySelectorAll('.day.selected').forEach(el => el.classList.remove('selected'));
            event.target.closest('.day').classList.add('selected');
            document.getElementById('taskDate').valueAsDate = new Date(dateStr + 'T00:00:00');
        }

        // Render Tareas
        function renderTasks() {
            const sortedTasks = [...tasks].sort((a, b) => {
                const priorityOrder = { high: 0, medium: 1, low: 2 };
                return priorityOrder[a.priority] - priorityOrder[b.priority];
            });

            const html = sortedTasks.map((task, index) => `
                <div class="task-item ${task.priority} ${task.completed ? 'completed' : ''}">
                    <div class="checkbox" onclick="toggleTask(${index})">
                        ${task.completed ? '✓' : ''}
                    </div>
                    <div class="task-content">
                        <div class="task-text">${escapeHtml(task.text)}</div>
                        <div class="task-date">${new Date(task.date).toLocaleDateString('es-ES', { weekday: 'short', month: 'short', day: 'numeric' })}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${index})">✕</button>
                </div>
            `).join('');

            document.getElementById('tasksList').innerHTML = html || '<p style="text-align: center; color: var(--text-secondary); padding: 20px;">Sin tareas pendientes</p>';
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const dateInput = document.getElementById('taskDate');

            if (!input.value.trim()) {
                alert('Por favor ingresa una tarea');
                return;
            }

            tasks.push({
                text: input.value,
                date: dateInput.value,
                priority: selectedPriority,
                completed: false,
                id: Date.now()
            });

            localStorage.setItem('tasks', JSON.stringify(tasks));
            input.value = '';
            input.focus();
            renderTasks();
            renderCalendar();
            updateReminders();
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
            renderCalendar();
            updateReminders();
        }

        function selectPriority(priority) {
            selectedPriority = priority;
            document.querySelectorAll('.priority-btn').forEach(btn => btn.classList.remove(btn.classList[1]));
            event.target.classList.add(priority);
        }

        // Recordatorios
        function updateReminders() {
            const today = new Date();
            const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);

            const upcomingTasks = tasks.filter(task => {
                if (task.completed) return false;
                const taskDate = new Date(task.date);
                return taskDate >= today && taskDate <= nextWeek;
            }).sort((a, b) => new Date(a.date) - new Date(b.date)).slice(0, 5);

            const html = upcomingTasks.length > 0
                ? upcomingTasks.map(task => `
                    <div class="reminder-item">
                        <span class="reminder-time">${new Date(task.date).toLocaleDateString('es-ES', { weekday: 'short', month: 'short', day: 'numeric' })}</span>
                        ${escapeHtml(task.text)}
                    </div>
                `).join('')
                : '<div class="no-reminders">¡Sin tareas próximas!<br>Disfruta tu descanso</div>';

            document.getElementById('remindersList').innerHTML = html;
        }

        // Navegación
        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
            updateHeaderDate();
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
            updateHeaderDate();
        }

        function today() {
            currentDate = new Date();
            renderCalendar();
            updateHeaderDate();
        }

        function updateHeaderDate() {
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            const dateStr = new Date().toLocaleDateString('es-ES', options);
            document.getElementById('todayDate').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Iniciar
        init();
        setInterval(updateReminders, 60000); // Actualizar recordatorios cada minuto
    </script>
</body>
</html>
